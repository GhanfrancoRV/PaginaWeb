<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Calculadora de Edad</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  
  <div class="contenedorTexto">
      <h1>No mames Mary Jane :v</h1>
  </div>

  <div class="container">
    <h1>Calcula tu tiempo de vida wawita :v</h1>

    <label for="nombre">Nombre:</label>
    <input type="texto" id="nombre">

    <label for="anio">Año de nacimiento:</label>
    <input type="numero" id="ano" placeholder="1990">

    <label for="mes">Mes de nacimiento:</label>
    <input type="numero" id="mes" placeholder="1-12">

    <label for="dia">Día de nacimiento:</label>
    <input type="numero" id="dia" placeholder="1-31">

    <button onclick="calcularEdad()">Calcular</button>

    <div id="resultado"></div>
    <div id="imagen"></div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
